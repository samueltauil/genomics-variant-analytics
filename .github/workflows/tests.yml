name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  hygiene-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run synthetic repository tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate presenter positioning and assumptions
        run: >-
          python3 scripts/review_positioning.py
          --review-date 2026-09-19
          --check-report docs/positioning-review.json